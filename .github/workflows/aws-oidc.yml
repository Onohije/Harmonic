name: AWS OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::533267195508:role/GitHubActions-Harmonic-OIDC
          aws-region: eu-west-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload test file to S3
       run: |
          echo "Hello from GitHub Actions OIDC!" > test.txt
          aws s3 cp test.txt s3://harmonic-oidc-533267195508/test.txt
